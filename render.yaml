# Render Blueprint: Rails API + PostgreSQL
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render → New → Blueprint → apply render.yaml
# Or create the web service manually and copy build/start commands from README.

databases:
  - name: acme-salary-db
    plan: free
    databaseName: acme_salary_management
    user: acme_salary_management

services:
  - type: web
    name: acme-salary-api
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
